<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Remote Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="#FF0000">
          <path d="M23.498 6.163a3.003 3.003 0 0 0-2.11-2.11C19.518 3.545 12 3.545 12 3.545s-7.518 0-9.388.507a3.003 3.003 0 0 0-2.11 2.11C0 8.033 0 12 0 12s0 3.967.502 5.837a3.003 3.003 0 0 0 2.11 2.11c1.87.507 9.388.507 9.388.507s7.518 0 9.388-.507a3.003 3.003 0 0 0 2.11-2.11C24 15.967 24 12 24 12s0-3.967-.502-5.837zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <h1>YouTube Remote</h1>
      </div>
      <span id="status-badge" class="badge warning">未接続</span>
    </header>

    <main>
      <!-- URL 設定画面 -->
      <section class="settings-section">
        <label for="remote-url-input">リモコンUIのURL (GitHub Pagesなど):</label>
        <div class="input-group">
          <input type="url" id="remote-url-input" placeholder="https://username.github.io/youtube-remote/" />
          <button id="save-url-btn">保存</button>
        </div>
        <p class="help-text">※ スマホ側で開くリモコンHTMLの公開URLを入力してください。</p>
      </section>

      <!-- 接続用QRコード表示画面 -->
      <section id="qr-section" class="qr-section hidden">
        <div class="qr-container">
          <div id="qrcode"></div>
          <div class="loader" id="qr-loader">
            <div class="spinner"></div>
            <p>Peer IDを生成中...</p>
          </div>
        </div>
        <p class="qr-tip">同じWi-Fiに繋いだスマホでスキャンしてください</p>
        
        <div class="peer-info">
          <span class="label">Peer ID:</span>
          <span id="peer-id-val">----</span>
          <button id="copy-id-btn" class="icon-btn" title="IDをコピー">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
          </button>
        </div>
      </section>
      
      <!-- YouTube未検出時のエラー -->
      <section id="no-yt-section" class="no-yt-section hidden">
        <div class="error-icon">⚠️</div>
        <p>YouTubeのページ (youtube.com) が見つかりません。</p>
        <p class="help-text">YouTubeを開いてから、このポップアップを再起動してください。</p>
      </section>
    </main>
  </div>

  <script src="lib/qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
